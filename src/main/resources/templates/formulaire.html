<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulaire étudiant</title>
  <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
  <style>
    body { font-family: Arial, sans-serif; margin: 0; }
    header { background: #222; color: #fff; padding: 12px 20px; }
    nav { background: #333; padding: 8px 20px; }
    nav a { color: #fff; text-decoration: none; margin-right: 16px; }
    main { padding: 20px; max-width: 800px; margin: 0 auto; }
    form { margin: 12px 0; display: flex; gap: 8px; flex-wrap: wrap; }
    input { padding: 6px; }
    button, .btn { padding: 6px 12px; cursor: pointer; }
    footer { background: #f0f0f0; text-align: center; padding: 12px; margin-top: 24px; }
  </style>
</head>
<body>

<div th:replace="~{common/header :: header}"></div>
<div th:replace="~{common/menu :: menu}"></div>

<main class="container">
  <!-- ADD FORM -->
  <div th:if="${editMode == null or !editMode}">
    <h1>Nouveau étudiant</h1>
    <form th:action="@{/students/add}" th:object="${student}" method="post">
      <input class="form-control mb-2" type="text" th:field="*{numeroInscription}" placeholder="N° inscription" required>
      <input class="form-control mb-2" type="text" th:field="*{nom}" placeholder="Nom" required>
      <input class="form-control mb-2" type="text" th:field="*{prenom}" placeholder="Prénom" required>
      <input class="form-control mb-2" type="date" th:field="*{dateNaissance}" required>
      <input class="form-control mb-2" type="number" step="0.01" min="0" max="20" th:field="*{moyenneAnneePrecedente}" placeholder="Moyenne année précédente" required>
      <select class="form-select mb-2" th:field="*{niveauEtude}" required>
        <option value="" disabled>Niveau d'étude</option>
        <option value="L1">L1</option>
        <option value="L2">L2</option>
        <option value="L3">L3</option>
        <option value="M1">M1</option>
        <option value="M2">M2</option>
      </select>
      <button class="btn btn-primary" type="submit">Ajouter</button>
    </form>
    <p>Après l'ajout, vous serez redirigé vers la <a href="/students/list">liste des étudiants</a>.</p>
  </div>

  <!-- EDIT FORM -->
  <div th:if="${editMode}">
    <h1>Modifier l'étudiant</h1>
    <form th:action="@{/students/update/{id}(id=${student.id})}" th:object="${student}" method="post">
      <input class="form-control mb-2" type="text" th:field="*{numeroInscription}" placeholder="N° inscription" required>
      <input class="form-control mb-2" type="text" th:field="*{nom}" placeholder="Nom" required>
      <input class="form-control mb-2" type="text" th:field="*{prenom}" placeholder="Prénom" required>
      <input class="form-control mb-2" type="date" th:field="*{dateNaissance}" required>
      <input class="form-control mb-2" type="number" step="0.01" min="0" max="20" th:field="*{moyenneAnneePrecedente}" placeholder="Moyenne année précédente" required>
      <select class="form-select mb-2" th:field="*{niveauEtude}" required>
        <option value="" disabled>Niveau d'étude</option>
        <option value="L1">L1</option>
        <option value="L2">L2</option>
        <option value="L3">L3</option>
        <option value="M1">M1</option>
        <option value="M2">M2</option>
      </select>
      <button class="btn btn-primary" type="submit">Mettre à jour</button>
      <a class="btn btn-secondary" href="/students/list">Annuler</a>
    </form>
  </div>
</main>

<div th:replace="~{common/footer :: footer}"></div>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>

</body>
</html>
