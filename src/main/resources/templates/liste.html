<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liste des étudiants</title>
  <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
  <style>
    body { font-family: Arial, sans-serif; margin: 0; }
    header { background: #222; color: #fff; padding: 12px 20px; }
    nav { background: #333; padding: 8px 20px; }
    nav a { color: #fff; text-decoration: none; margin-right: 16px; }
    main { padding: 20px; max-width: 1000px; margin: 0 auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background: #f0f0f0; }
    .btn { padding: 6px 12px; cursor: pointer; }
    footer { background: #f0f0f0; text-align: center; padding: 12px; margin-top: 24px; }
  </style>
</head>
<body>

<div th:replace="~{common/header :: header}"></div>
<div th:replace="~{common/menu :: menu}"></div>

<main class="container">
  <h1>Liste des étudiants</h1>
  <p>Étudiants ajoutés depuis le formulaire (<span th:text="${#lists.size(students)}">0</span>)</p>

  <table class="table table-striped table-bordered">
    <thead>
      <tr>
        <th>ID</th>
        <th>N° inscription</th>
        <th>Nom</th>
        <th>Prénom</th>
        <th>Date de naissance</th>
        <th>Moyenne préc.</th>
        <th>Niveau</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr th:if="${#lists.isEmpty(students)}">
        <td colspan="8">Aucun étudiant à afficher.</td>
      </tr>
      <tr th:each="s : ${students}">
        <td th:text="${s.id}"></td>
        <td th:text="${s.numeroInscription}"></td>
        <td th:text="${s.nom}"></td>
        <td th:text="${s.prenom}"></td>
        <td th:text="${s.dateNaissance}"></td>
        <td th:text="${s.moyenneAnneePrecedente}"></td>
        <td th:text="${s.niveauEtude}"></td>
        <td>
          <a th:href="@{/students/edit/{id}(id=${s.id})}">Modifier</a>
          |
          <a th:href="@{/students/delete/{id}(id=${s.id})}" onclick="return confirm('Supprimer cet étudiant ?');">Supprimer</a>
        </td>
      </tr>
    </tbody>
  </table>

  <p><a class="btn btn-primary" href="/students/new">+ Ajouter un étudiant</a></p>
</main>

<div th:replace="~{common/footer :: footer}"></div>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>

</body>
</html>
